<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shooter Game with City Environment</title>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/loaders/GLTFLoader.js"></script>

<script>
    // Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(light);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(0, 10, 0);
    scene.add(directionalLight);

    // Create the City Environment (basic buildings)
    const streetMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
    const buildingMaterial = new THREE.MeshBasicMaterial({ color: 0x7b7b7b });

    const street = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), streetMaterial);
    street.rotation.x = -Math.PI / 2;
    scene.add(street);

    // Create Buildings (Simple cubes)
    for (let i = 0; i < 10; i++) {
        const building = new THREE.Mesh(new THREE.BoxGeometry(10, Math.random() * 50 + 50, 10), buildingMaterial);
        building.position.set(Math.random() * 2000 - 1000, building.geometry.parameters.height / 2, Math.random() * 2000 - 1000);
        scene.add(building);
    }

    // Load Human Model (replace with a real human model)
    const loader = new THREE.GLTFLoader();
    let player;
    loader.load('https://example.com/path/to/your/3dmodel.glb', function(gltf) {
        player = gltf.scene;
        player.scale.set(1, 1, 1);
        player.position.set(0, 1, 0);
        scene.add(player);
    });

    // Camera Position
    camera.position.z = 100;

    // Animate
    function animate() {
        requestAnimationFrame(animate);

        if (player) {
            player.rotation.y += 0.01;  // Rotate player model for now
        }

        renderer.render(scene, camera);
    }

    animate();
</script>

</body>
</html>
